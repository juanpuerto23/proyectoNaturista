<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy"
      content="default-src 'self' https:; img-src 'self' data: https:; script-src 'self' 'unsafe-inline' https:; style-src 'self' 'unsafe-inline' https:; connect-src 'self' http://localhost:3000 https: ws:;">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HerbalSys | Login</title>
    <link rel="stylesheet" href="css/styleLogin.css">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>

<body>
    <div class="login-container">
        <form class="login-card" id="loginForm" onsubmit="handleLogin(event)">

            <!-- Logo y nombre -->
            <div class="text-center mb-4">
                <i class="fa-solid fa-seedling fa-2x text-success me-2"></i>
                <h2 class="mb-0 fw-bold">Herbalsys
                    <span class="custom-badge">Sistema P.O.S</span>
                </h2>
            </div>

            <!-- Usuario -->
            <div class="input-group">
                <label>Nombre Usuario</label>
                <div class="input-box">
                    <i class="fa-solid fa-envelope"></i>
                    <input type="text" id="username" required autocomplete="username">
                </div>
            </div>

            <!-- Password -->
            <div class="input-group">
                <label>Contraseña</label>
                <div class="input-box">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" id="password" required autocomplete="current-password">
                </div>
            </div>

            <!-- Rol automático: eliminado selector manual; backend determinará rol -->

            <!-- Forgot password -->
            <a href="#" class="forgot" id="forgot-link">Olvidó su contraseña?</a>

            <!-- Botón login -->
            <button type="submit" class="login-btn">
                <i class="fa-solid fa-arrow-right-to-bracket"></i> Login
            </button>

            <!-- Error message -->
            <div id="errorMessage" style="display:none; color:red; text-align:center; margin-top:10px;"></div>

        </form>
    </div>

    <!-- Modal Forgot Password -->
    <div id="forgot-modal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h3>Recuperar Contraseña</h3>
            <p>Por favor, contacte con el proveedor del sistema para restablecer su contraseña.</p>
        </div>
    </div>
    <!-- Bootstrap JS -->
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.0/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>

    <!-- JS custom -->
    <script>
      // Rol se determina automáticamente en el backend según usuario.

      // Manejar login
      async function handleLogin(event) {
        event.preventDefault();

        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value.trim();
        const errorDiv = document.getElementById('errorMessage');

        if (!username || !password) {
          errorDiv.textContent = 'Por favor completa todos los campos';
          errorDiv.style.display = 'block';
          return;
        }

        try {
          errorDiv.style.display = 'none';
          
          const response = await fetch('/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, password })
          });

          const data = await response.json();

          if (!response.ok) {
            errorDiv.textContent = data.error || 'Error al iniciar sesión';
            errorDiv.style.display = 'block';
            return;
          }

          if (data.success && data.user) {
            // Guardar información del usuario en localStorage
            localStorage.setItem('user', JSON.stringify({
              id_usuario: data.user.id_usuario,
              user_login: data.user.user_login,
              email: data.user.email || null,
              rol: data.user.rol
            }));

            // Redirigir al menú
            window.location.href = '/menu.html';
          }
        } catch (err) {
          console.error('Error en login:', err);
          errorDiv.textContent = 'Error de conexión con el servidor';
          errorDiv.style.display = 'block';
        }
      }

      // Modal para forgot password
      const modal = document.getElementById('forgot-modal');
      const forgotLink = document.getElementById('forgot-link');
      const closeBtn = document.querySelector('.close');

      if (forgotLink) {
        forgotLink.addEventListener('click', (e) => {
          e.preventDefault();
          modal.style.display = 'block';
        });
      }

      if (closeBtn) {
        closeBtn.addEventListener('click', () => {
          modal.style.display = 'none';
        });
      }

      window.onclick = function(event) {
        if (event.target === modal) {
          modal.style.display = 'none';
        }
      };
    </script>
</body>

</html>
