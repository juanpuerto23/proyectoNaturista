<!doctype html>
<html lang="es">

<head>
  <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy"
      content="default-src 'self' https:; img-src 'self' data: https:; script-src 'self' 'unsafe-inline' https:; style-src 'self' 'unsafe-inline' https:; connect-src 'self' http://localhost:3000 https: ws:;">
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>HerbalSys - Inventario</title>

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Custom CSS -->
  <link rel="stylesheet" href="../css/styleInventory.css">
</head>

<body class="bg-light">

  <!-- NAVBAR (solo móvil) -->
  <nav class="navbar navbar-light bg-white shadow-sm d-lg-none">
    <div class="container-fluid">
      <button class="btn btn-outline-success" type="button" data-bs-toggle="offcanvas" data-bs-target="#sidebar"
        aria-controls="sidebar">
        ☰
      </button>
      <span class="navbar-brand mb-0 h1">Inventario</span>
    </div>
  </nav>

  <div class="container-fluid">
    <div class="row">
      <!-- SIDEBAR -->
      <aside id="sidebar" class="col-lg-2 d-none d-lg-block bg-white vh-100 border-end pt-4">
        <div class="px-3">
          <div class="d-flex align-items-center mb-4">
            <div class="me-2">
              <svg width="34" height="34" viewBox="0 0 24 24" fill="green" class="text-success">
                <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="1.2"></circle>
              </svg>
            </div>
            <div>
              <h6 class="mb-0">HerbalSys</h6>
              <small class="text-muted">Tienda Naturista P.O.S</small>
            </div>
          </div>
          <ul class="nav nav-pills flex-column">
            <li class="nav-item mb-1"><a href="../menu.html" class="nav-link">Dashboard</a></li>
            <li class="nav-item mb-1"><a href="inventario.html" class="nav-link active">Inventario</a></li>
            <li class="nav-item mb-1"><a href="gestorClientesMenu.html" class="nav-link">Clientes</a></li>
            <li class="nav-item mb-1"><a id="btnFacturasElectronicas" class="nav-link"
                href="facturasElectronicas.html">Ventas</a></li>
            <li class="nav-item mb-1"><a href="reportes.html" class="nav-link">Reportes</a></li>
            </li>
          </ul>
        </div>
      </aside>

      <!-- MAIN -->
      <main class="col-lg-10 ms-auto px-4">
        <div class="row g-3 py-4">
          <div class="col-12 d-flex justify-content-between align-items-center">
            <h3 class="fw-bold">Gestión de Inventario</h3>
            <div class="d-flex gap-2">
              <button class="btn btn-success btn-sm" data-bs-toggle="modal" data-bs-target="#modalNuevo">+ Añadir Producto</button>
              <button id="btnAddProveedor" class="btn btn-outline-success btn-sm" data-bs-toggle="modal" data-bs-target="#modalProveedor">+ Añadir Proveedor</button>
              <button id="btnAddCategoria" class="btn btn-outline-success btn-sm" data-bs-toggle="modal" data-bs-target="#modalCategoria">+ Añadir Categoría</button>
            </div>
          </div>

          <!-- Filtros -->
          <section class="col-12">
            <div class="card shadow-sm mb-3">
              <div class="card-body">
                <div class="row g-2">
                  <div class="col-md-4">
                    <input type="text" id="busquedaNombre" class="form-control" placeholder="Buscar por nombre">
                  </div>
                  <div class="col-md-3">
                    <select id="filtroCategoria" class="form-select">
                      <option value="">Categorías</option>
                    </select>
                  </div>
                  <div class="col-md-3">
                    <select id="filtroProveedor" class="form-select">
                      <option value="">Proveedores</option>
                    </select>
                  </div>
                  <div class="col-md-2">
                    <button id="btnBuscarTop" class="btn btn-success w-100">Buscar</button>
                  </div>
                </div>
              </div>
            </div>
          </section>

          <!-- Tabla de Inventario -->
          <section class="col-12">
            <div class="card shadow-sm">
              <div class="card-body p-0">
                <div class="table-responsive">
                  <table class="table table-hover mb-0" id="tabla-productos">
                    <thead class="table-light">
                      <tr>
                        <th>Nombre</th>
                        <th>ID</th>
                        <th>Categoria</th>
                        <th>Stock actual</th>
                        <th>Fecha vencimiento</th>
                        <th>Precio venta</th>
                        <th>Descripción</th>
                        <th class="text-end">Acciones</th>
                      </tr>
                    </thead>
                    <tbody>

                    </tbody>
                  </table>
                </div>
              </div>
            </div>
          </section>
        </div>
      </main>
    </div>
  </div>

  <!-- Modal: Añadir Producto -->
  <div class="modal fade" id="modalNuevo" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Añadir Producto</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <form id="productForm" onsubmit="return false;">
            <div class="row g-2">
              <div class="col-md-6">
                <label class="form-label">Nombre</label>
                <input id="p_name" class="form-control" required>
              </div>
              <div class="col-md-6">
                <label class="form-label">ID</label>
                <input id="p_sku" class="form-control" required>
              </div>
              <div class="col-md-4">
                <label class="form-label">Categoria</label>
                <select id="p_category" class="form-select"></select>
              </div>
              <div class="col-md-4">
                <label class="form-label">Stock</label>
                <input id="p_stock" type="number" class="form-control" min="0">
              </div>
              <div class="col-md-4">
                <label class="form-label">Fecha vencimiento</label>
                <input id="p_exp" type="date" class="form-control" required>
              </div>
              <div class="col-md-4">
                <label class="form-label">Proveedor</label>
                <select id="p_supplier" class="form-select" required></select>
              </div>
              <div class="col-md-4">
                <label class="form-label">Precio venta</label>
                <input id="p_pv" type="number" class="form-control" min="0"></input>
              </div>
              <div class="col-md-4">
                <label class="form-label">Precio compra</label>
                <input id="p_pc" type="number" class="form-control" min="0"></input>
              </div>
              <div class="col-md-12">
                <label class="form-label">Descripción</label>
                <input id="p_desc" class="form-control"></input>
              </div>
            </div>
          </form>
        </div>
        <div class="modal-footer">
          <button class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
          <button class="btn btn-success" id="btnGuardar">Guardar</button>
        </div>
      </div>
    </div>
  </div>

        <!-- Modal: Añadir Proveedor -->
        <div class="modal fade" id="modalProveedor" tabindex="-1" aria-hidden="true">
          <div class="modal-dialog modal-lg modal-dialog-centered">
            <div class="modal-content">
              <div class="modal-header">
                <h5 class="modal-title">Añadir Proveedor</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
              </div>
              <div class="modal-body">
                <form id="formProveedor" onsubmit="return false;">
                  <div class="row g-2">
                    <div class="col-md-6">
                      <label class="form-label">Nombre del proveedor</label>
                      <input id="prov_nombre" class="form-control" required>
                    </div>
                    <div class="col-md-6">
                      <label class="form-label">NIT</label>
                      <input id="prov_nit" class="form-control">
                    </div>
                    <div class="col-md-6">
                      <label class="form-label">Teléfono</label>
                      <input id="prov_telefono" class="form-control">
                    </div>
                    <div class="col-md-6">
                      <label class="form-label">Email</label>
                      <input id="prov_email" type="email" class="form-control">
                    </div>
                    <div class="col-md-12">
                      <label class="form-label">Dirección</label>
                      <input id="prov_direccion" class="form-control">
                    </div>
                    <div class="col-md-12">
                      <label class="form-label">Contacto</label>
                      <input id="prov_contacto" class="form-control">
                    </div>
                  </div>
                </form>
              </div>
              <div class="modal-footer">
                <button class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                <button class="btn btn-success" id="btnSaveProveedor">Guardar Proveedor</button>
              </div>
            </div>
          </div>
        </div>

        <!-- Modal: Añadir Categoría -->
        <div class="modal fade" id="modalCategoria" tabindex="-1" aria-hidden="true">
          <div class="modal-dialog modal-md modal-dialog-centered">
            <div class="modal-content">
              <div class="modal-header">
                <h5 class="modal-title">Añadir Categoría</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
              </div>
              <div class="modal-body">
                <form id="formCategoria" onsubmit="return false;">
                  <div class="row g-2">
                    <div class="col-12">
                      <label class="form-label">Nombre de la categoría</label>
                      <input id="cat_nombre" class="form-control" required>
                    </div>
                    <div class="col-12">
                      <label class="form-label">Descripción</label>
                      <textarea id="cat_desc" class="form-control" rows="3"></textarea>
                    </div>
                  </div>
                </form>
              </div>
              <div class="modal-footer">
                <button class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                <button class="btn btn-success" id="btnSaveCategoria">Guardar Categoría</button>
              </div>
            </div>
          </div>
        </div>

  <!-- Bootstrap -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Inventario logic (static served at /js) -->
  <script src="../js/inventario.js" type="module"></script>
</body>

</html>
