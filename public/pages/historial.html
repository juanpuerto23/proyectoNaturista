<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>HerbalSys - Historial de Ventas</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/styleHistory.css">
</head>
<body class="bg-light">
  <nav class="navbar navbar-light bg-white shadow-sm d-lg-none">
    <div class="container-fluid">
      <button class="btn btn-outline-success" type="button" data-bs-toggle="offcanvas" data-bs-target="#sidebar" aria-controls="sidebar">☰</button>
      <span class="navbar-brand mb-0 h1">Historial</span>
    </div>
  </nav>

  <div class="container-fluid">
    <div class="row">
      <aside id="sidebar" class="offcanvas offcanvas-start col-lg-2 d-lg-block bg-white vh-100 border-end pt-4" tabindex="-1">
        <div class="px-3">
          <div class="d-flex align-items-center mb-4 sidebar-brand">
            <div class="me-2">
              <svg width="34" height="34" viewBox="0 0 24 24" fill="green" class="text-success">
                <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="1.2"></circle>
              </svg>
            </div>
            <div>
              <h6 class="mb-0">HerbalSys</h6>
              <small class="text-muted">Tienda Naturista P.O.S</small>
            </div>
          </div>
            <ul class="nav nav-pills flex-column">
              <li class="nav-item mb-1"><a class="nav-link" href="../menu.html">Dashboard</a></li>
              <li class="nav-item mb-1"><a class="nav-link" href="../pages/inventario.html">Inventario</a></li>
              <li class="nav-item mb-1"><a class="nav-link" href="../pages/gestorClientesMenu.html">Clientes</a></li>
              <li class="nav-item mb-1"><a id="btnFacturasElectronicas" class="nav-link" href="facturasElectronicas.html">Ventas</a></li>
              <li class="nav-item mb-1"><a class="nav-link active" href="../pages/historial.html">Historial</a></li>
              <li class="nav-item mb-1"><a class="nav-link" href="../pages/reportes.html">Reportes</a></li>
            </ul>
        </div>
      </aside>

      <main class="col-lg-10 ms-auto px-4">
        <div class="row g-3 py-4">
          <div class="col-12 d-flex justify-content-between align-items-center">
            <h3 class="fw-bold">Historial de Productos Vendidos</h3>
            <div>
              <input id="hist_filter" class="form-control form-control-sm" placeholder="Filtrar por nombre o código" style="width:280px; display:inline-block;">
            </div>
          </div>

          <section class="col-12">
            <div class="card shadow-sm">
              <div class="card-body p-3">
                <div class="table-responsive">
                  <table class="table table-hover mb-0" id="historial-table">
                    <thead class="table-light small">
                      <tr>
                        <th>Fecha</th>
                        <th>Factura</th>
                        <th>Producto</th>
                        <th>Código</th>
                        <th>Cantidad</th>
                        <th>Precio Unit.</th>
                        <th>Subtotal</th>
                        <th>Cliente</th>
                        <th>Empleado</th>
                      </tr>
                    </thead>
                    <tbody></tbody>
                  </table>
                </div>
              </div>
            </div>
          </section>
        </div>
      </main>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/historial.js" type="module"></script>
</body>
</html>
